<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BigInt — Calculadora</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header>
    <div>
      <p class="eyebrow">C++ • BigInt</p>
      <h1>Inteiros de tamanho ilimitado</h1>
      <p class="subtitle">Uma interface web para explorar as operações do seu projeto BigInt.</p>
    </div>
    <a class="github" href="https://github.com/" target="_blank" rel="noreferrer">GitHub ↗</a>
  </header>

  <section class="card inputs">
    <label>A
      <input id="a" value="12345678901234567890" inputmode="numeric" autocomplete="off">
    </label>
    <label>B
      <input id="b" value="9876543210" inputmode="numeric" autocomplete="off">
    </label>
  </section>

  <section class="card result-card">
    <div class="result-head"><span>Resultado</span><button id="copy">Copiar</button></div>
    <pre id="result">Pronto.</pre>
    <p id="status" class="status"></p>
  </section>

  <section class="card">
    <div class="section-title">Aritmética</div>
    <div class="grid">
      <button data-op="add">A + B</button><button data-op="sub">A − B</button>
      <button data-op="mul">A × B</button><button data-op="div">A ÷ B</button>
      <button data-op="mod">A % B</button><button data-op="factA">!A</button>
      <button data-op="factB">!B</button>
    </div>
  </section>

  <section class="card">
    <div class="section-title">Outras operações</div>
    <div class="grid">
      <button data-op="lt">A &lt; B</button><button data-op="eq">A = B</button>
      <button data-op="gt">A &gt; B</button><button data-op="abs">abs(A)</button>
      <button data-op="neg">−A</button><button data-op="inc">A++</button>
      <button data-op="dec">A--</button><button data-op="shl">A &lt;&lt; B</button>
      <button data-op="shr">A &gt;&gt; B</button><button data-op="toint">toInt(A)</button>
    </div>
  </section>

  <footer>
    <span>Baseado no projeto acadêmico BigInt em C++.</span>
    <span>Web demo • GitHub Pages ready</span>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
